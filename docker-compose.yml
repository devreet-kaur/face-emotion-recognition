version: "3.9"

services:
  emotion-api:
    build: .
    image: mai204-emotion:latest
    # macOS: port 5001 outside because port 5000 is blocked by AirPlay Receiver
    # Windows: change 5001 to 8000
    ports:
      - "5001:8000"
    volumes:
      - ./results:/app/results:ro
      - ./data/affectnet:/app/data/affectnet:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
