stages:
  prepare:
    cmd: python src/dataset.py --mode prepare
    deps:
      - src/dataset.py
      - data/FER
      - data/basic
    params:
      - data.train_ratio
      - data.val_ratio
      - data.test_ratio
      - data.image_size
      - data.mean
      - data.std
    outs:
      - data/merged

  train:
    cmd: python src/train.py --arch ${model.architecture}
    deps:
      - src/train.py
      - data/merged
    params:
      - model
      - training
      - optimizer
      - scheduler
      - augmentation
    outs:
      - results/models/best_model.pth
    metrics:
      - results/ablation_table.json:
          cache: false

  benchmark_preprocessing:
    cmd: python src/preprocessing.py --mode benchmark
    deps:
      - src/preprocessing.py
      - results/models/best_model.pth
      - data/merged
    params:
      - preprocessing
      - model.architecture
      - model.num_classes
    outs:
      - results/mcnemar_results.json
    metrics:
      - results/preprocessing_benchmark.csv:
          cache: false

  benchmark_explainability:
    cmd: python src/explainability.py --mode benchmark
    deps:
      - src/explainability.py
      - results/models/best_model.pth
      - data/merged
    params:
      - explainability
      - model
    outs:
      - results/explainability/heatmap_comparison_grid.png
    metrics:
      - results/pointing_game.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py --mode all
    deps:
      - src/evaluate.py
      - results/models/best_model.pth
      - data/affectnet
      - data/merged
    params:
      - evaluate
      - model
    outs:
      - results/affectnet_eval.json
      - results/robustness_results.json
      - results/plots/confusion_matrix.png
    metrics:
      - results/affectnet_eval.json:
          cache: false

  adaptive_preprocessing_eval:
    cmd: python src/preprocessing.py --mode adaptive_eval
    deps:
      - src/preprocessing.py
      - results/models/best_model.pth
      - data/merged
    params:
      - preprocessing.adaptive_dark_threshold
      - preprocessing.adaptive_bright_threshold
      - preprocessing.clahe_clip_limit_low
      - preprocessing.clahe_tile_grid_large
      - preprocessing.unsharp_sigma
      - preprocessing.unsharp_strength
      - model.architecture
      - model.num_classes
    outs:
      - results/adaptive_preprocessing_results.json
    metrics:
      - results/adaptive_preprocessing_results.json:
          cache: false

  explainability_hybrid:
    cmd: python src/explainability.py --mode hybrid
    deps:
      - src/explainability.py
      - results/models/best_model.pth
      - data/merged
    params:
      - explainability_hybrid
      - explainability.target_layer_efficientnet
      - explainability.target_layer_resnet50
      - explainability.target_layer_mobilenet
      - model
    outs:
      - results/hybrid_explainability_results.json
      - results/explainability/hybrid_heatmap_grid.png
    metrics:
      - results/hybrid_explainability_results.json:
          cache: false
